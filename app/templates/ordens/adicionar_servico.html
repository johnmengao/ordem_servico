{% extends 'base.html' %}
{% block conteudo %}
<div class="container mt-4">
  <!-- Card novo serviço -->
  <div class="card shadow">
    <div class="card-header bg-dark text-white">
      <h4>Adicionar Serviço à Ordem #{{ ordem_id }}</h4>
    </div>
    <div class="card-body">
      <form method="post">
        <label for="servico_id">Serviço:</label>
        <select name="servico_id" id="servico_id" required>
          <option value="">Selecione um serviço</option>
          {% for servico in servicos %}
            <option value="{{ servico.id }}" data-preco="{{ servico.preco_padrao }}">{{ servico.nome }}</option>
          {% endfor %}
        </select><br><br>

        <label for="quantidade">Quantidade:</label>
        <input type="number" name="quantidade" id="quantidade" value="1" min="1" required><br><br>

        <label for="preco_unitario">Preço unitário:</label>
        <input type="number" step="0.01" name="preco_unitario" id="preco_unitario" required><br><br>

        <label for="desconto">Desconto (%):</label>
        <input type="number" step="0.01" name="desconto" id="desconto" value="0.00" min="0" max="100"><br><br>

        <div class="text-end">
          <button type="submit" class="btn btn-outline-success btn-sm mb-2">➕ Adicionar</button>
        <div>
      </form>
    </div>
  </div>
</div>
<script>
  document.getElementById('servico_id').addEventListener('change', function () {
    const selected = this.options[this.selectedIndex];
    const preco = selected.getAttribute('data-preco');
    if (preco) {
      document.getElementById('preco_unitario').value = parseFloat(preco).toFixed(2);
    }
  });
</script>
{% endblock %}
