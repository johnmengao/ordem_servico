{% extends 'base.html' %}
{% block conteudo %}
<div class="container mt-4">
  <!-- Card novo serviço -->
  <div class="card shadow">
    <div class="card-header bg-dark text-white">
      <h4>Adicionar Peça à Ordem #{{ ordem_id }}</h4>
    </div>
    <div class="card-body">
      <form method="post">
        <label for="peca_id">Peça:</label>
        <select name="peca_id" id="peca_id" required>
          <option value="">Selecione uma peça</option>
          {% for peca in pecas %}
            <option value="{{ peca.id }}" data-preco="{{ peca.preco_padrao }}">
              {{ peca.nome }} (R$ {{ '%.2f'|format(peca.preco_padrao) }})
            </option>
          {% endfor %}
        </select><br><br>

        <label for="quantidade">Quantidade:</label>
        <input type="number" name="quantidade" id="quantidade" value="1" min="1" required><br><br>

        <label for="preco_unitario">Preço unitário:</label>
        <input type="number" step="0.01" name="preco_unitario" id="preco_unitario" required>
        <button type="button" onclick="resetarPreco()">Usar preço padrão</button><br><br>

        <label for="desconto">Desconto (%):</label>
        <input type="number" step="0.01" name="desconto" id="desconto" value="0.00" min="0" max="100"><br><br>

        <label for="subtotal">Subtotal:</label>
        <input type="text" id="subtotal" readonly><br><br>

        <div class="text-end">
          <button type="submit" class="btn btn-outline-success btn-sm mb-2">➕ Adicionar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function calcularSubtotal() {
    const preco = parseFloat(document.getElementById('preco_unitario').value) || 0;
    const quantidade = parseInt(document.getElementById('quantidade').value) || 1;
    const desconto = parseFloat(document.getElementById('desconto').value) || 0;

    const subtotal = preco * quantidade * (1 - desconto / 100);
    document.getElementById('subtotal').value = subtotal.toFixed(2);
  }

  function resetarPreco() {
    const select = document.getElementById('peca_id');
    const preco = select.options[select.selectedIndex].getAttribute('data-preco');
    if (preco) {
      document.getElementById('preco_unitario').value = parseFloat(preco).toFixed(2);
      calcularSubtotal();
    }
  }

  document.getElementById('peca_id').addEventListener('change', function () {
    const preco = this.options[this.selectedIndex].getAttribute('data-preco');
    if (preco) {
      document.getElementById('preco_unitario').value = parseFloat(preco).toFixed(2);
      calcularSubtotal();
    }
  });

  document.getElementById('quantidade').addEventListener('input', calcularSubtotal);
  document.getElementById('preco_unitario').addEventListener('input', calcularSubtotal);
  document.getElementById('desconto').addEventListener('input', calcularSubtotal);
</script>
{% endblock %}
