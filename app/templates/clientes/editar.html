{% extends 'base.html' %}
{% block conteudo %}
<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0">Cadastro de Novo Cliente</h4>
    </div>
    <div class="card-body">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input type="text" name="nome" class="form-control" value="{{ cliente.nome }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Telefone</label>
          <input type="text" name="telefone" id="telefone" class="form-control" value="{{ cliente.telefone }}" placeholder="(99) 99999-9999">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" value="{{ cliente.email }}">
        </div>
        <div class="mb-3">
          <label class="form-label">CPF/CNPJ</label>
          <input type="text" name="cpf_cnpj" class="form-control" value="{{ cliente.cpf_cnpj }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Endereço</label>
          <textarea name="endereco" class="form-control" rows="2">{{ cliente.endereco }}</textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Observações</label>
          <textarea name="observacoes" class="form-control" rows="2">{{ cliente.observacoes }}</textarea>
        </div>
        <div class="text-end">
          <button type="submit" class="btn btn-outline-primary">💾Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/inputmask/5.0.8/inputmask.min.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    Inputmask({"mask": "(99) 99999-9999"}).mask(document.getElementById("telefone"));
  });
</script>
{% endblock %}
