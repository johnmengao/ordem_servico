<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Recuperar Senha</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .recuperar-container {
      background-color: #fff;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }

    input[type="email"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #0d6efd;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0b5ed7;
    }

    .mensagem {
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
      color: green;
    }

    .erro {
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
      color: red;
    }
  </style>
</head>
<body>
  <div class="recuperar-container">
    <h2>🔐 Recuperar Senha</h2>
    {% if mensagem %}
      <div class="mensagem">{{ mensagem }}</div>
    {% endif %}
    {% if erro %}
      <div class="erro">{{ erro }}</div>
    {% endif %}
    <form method="POST">
      <label for="email">Digite seu email:</label>
      <input type="email" name="email" id="email" required>
      <button type="submit">Enviar código de recuperação</button>
    </form>
  </div>
</body>
</html>
