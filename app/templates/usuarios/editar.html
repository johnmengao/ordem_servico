{% extends 'base.html' %}
{% block conteudo %}
<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0">Editar Usuário</h4>
    </div>
    <div class="card-body">
      <form method="POST" class="row g-3">
        <div class="col-md-6">
          <label for="nome" class="form-label">Nome:</label>
          <input type="text" class="form-control" id="nome" name="nome" value="{{ usuario.nome }}" required>
        </div>

        <div class="col-md-6">
          <label for="email" class="form-label">Email:</label>
          <input type="email" class="form-control" id="email" name="email" value="{{ usuario.email }}" required>
        </div>

        <div class="col-md-6">
          <label for="tipo" class="form-label">Tipo:</label>
          <select name="tipo" id="tipo" class="form-select" required>
            <option value="admin" {% if usuario.tipo == 'admin' %}selected{% endif %}>Admin</option>
            <option value="tecnico" {% if usuario.tipo == 'tecnico' %}selected{% endif %}>Técnico</option>
          </select>
        </div>

        <div class="col-md-6 d-flex align-items-center">
          <div class="form-check mt-4">
            <input class="form-check-input" type="checkbox" id="ativo" name="ativo" {% if usuario.ativo %}checked{% endif %}>
            <label class="form-check-label" for="ativo">Ativo</label>
          </div>
        </div>

        <div class="col-12 text-end">
          <button type="submit" class="btn btn-primary">Atualizar</button>
          <a href="/usuarios" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
