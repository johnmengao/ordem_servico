<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Ordem de Serviço{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-darkk shadow-sm">
      <div class="container justify-content-center">
        <ul class="navbar-nav">
          <li class="nav-item mx-3"><a class="nav-link" href="/dashboard">🏠 Dashboard</a></li>
          <li class="nav-item mx-3"><a class="nav-link" href="/clientes">👥 Clientes</a></li>
          <li class="nav-item mx-3"><a class="nav-link" href="/pecas">🔧 Peças</a></li>
          <li class="nav-item mx-3"><a class="nav-link" href="/servicos">🛠️ Serviços</a></li>
          <li class="nav-item mx-3"><a class="nav-link" href="/ordens">📂 Ordens</a></li>
          <li class="nav-item mx-3"><a class="nav-link text-danger" href="/logout">🚪 Sair</a></li>
        </ul>
      </div>
    </nav>

    <main class="container mt-3">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

    {% block conteudo %}{% endblock %}
  </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
